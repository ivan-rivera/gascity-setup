[workspace]
provider = "omp"

# herdr session backend — one workspace per rig + one for the city, one tab
# per agent. herdr 0.9.5 works with gc 1.5.0 via a compat symlink: gc's
# adapter dials the session socket under os.UserConfigDir(), which on macOS
# is ~/Library/Application Support/herdr/sessions/<city>/.herdr.sock, while
# herdr 0.9 binds under ~/.config/herdr/sessions/<city>/. The symlink
# bridges them:
#
#   mkdir -p "$HOME/Library/Application Support/herdr/sessions"
#   ln -sfn "$HOME/.config/herdr/sessions/gascity" \
#     "$HOME/Library/Application Support/herdr/sessions/gascity"
#
# (created on this machine 2026-10-19; scratch-city pilot passed spawn,
# respawn-after-kill, and tab/workspace creation). Drop the symlink when a
# gc release resolves herdr's XDG path directly. Sessions launched after a
# reload run under herdr; existing tmux sessions migrate as they restart
# (`gc restart` cuts over immediately). tmux remains the fallback backend.
[session]
provider = "herdr"

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
[providers.omp]
base = "builtin:omp"

# OMP harness with the model pinned to the oracle role (Opus 5.5 via
# OpenRouter) — the expensive, most-powerful consultant. `args` replaces the
# builtin preset's args, so the gc hook args are re-declared here.
[providers.omp-oracle]
base = "builtin:omp"
args = ["--hook", ".omp/hooks/gc-hook.ts", "--model", "openrouter/anthropic/claude-opus-5.5"]

# OpenRouter keys are split for cost tracking: OPENROUTER_API_KEY is OMP's
# own allocation; GASCITY_OPENROUTER_API_KEY is the dedicated GasCity key
# (value in ~/.gc/secrets.env, persisted into the supervisor env with
# `GC_SUPERVISOR_ENV=GASCITY_OPENROUTER_API_KEY gc supervisor install
# --force`). This upstream serves GasCity-run harnesses (codex/opencode).
[upstreams.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key = "$GASCITY_OPENROUTER_API_KEY"

# Full cost isolation — bill EVERY managed session's OMP/ocr spend to the
# GasCity key by overriding OMP's credential city-wide. Uncomment to enable.
# NOTE: this changes the launch fingerprint of all OMP agent sessions; the
# controller relaunches them (including the mayor). The per-agent overrides
# on agents/oracle and agents/reviewer already cover the big spenders.
# [workspace.env]
# OPENROUTER_API_KEY = "$GASCITY_OPENROUTER_API_KEY"

[defaults]
[defaults.rig]
[defaults.rig.imports]
[defaults.rig.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[agent_defaults]
# City-wide policy: append the owner-conventions prompt fragment to every
# agent's rendered prompt body (fills blank append_fragments only).
append_fragments = ["owner-conventions"]

# [mail]
# retention_ttl controls how long read messages are retained before purge.
# 0 disables retention; use "168h" for 7 days.
# "7d" is not a valid Go duration.
# It also sets how long a read mail bead stays open before the nudge-mail
# sweep closes it: unset keeps that sweep's own 60m default, while "0"
# disables the close phase too, leaving read mail beads open.
# retention_ttl = "0"

[[rigs]]
name = "omp-setup"
default_branch = "main"
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"
